<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIMS - AI-Powered FYP Management Portal</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="main-card">
  <div class="row g-0">
    
    <!-- LEFT PANEL: BACKGROUND IMAGE WITH OVERLAY LOGO -->
    <div class="col-lg-6 left-section-img">
      
    </div>

    <!-- RIGHT PANEL: LOGIN FORM -->
    <div class="col-lg-6 right-section">
      <!-- Top Navigation Text -->
      

      <!-- Welcome Heading -->
      <div class="login-header">
        <h2 class="welcome-title">Welcome Back</h2>
        <p class="welcome-sub">Sign in to your account to continue</p>
      </div>

      <form id="loginForm" onsubmit="return false;">
        <!-- Email / Registration Field -->
        <div class="form-group-custom">
          <label class="form-label">Email / Registration No.</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope input-icon"></i>
            <input type="text" class="form-control" placeholder="Enter your email or registration number" required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group-custom">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <i class="bi bi-lock input-icon"></i>
            <input type="password" id="passwordInput" class="form-control" placeholder="Enter your password" required>
            <i class="bi bi-eye-slash toggle-password" id="togglePassword"></i>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="d-flex justify-content-between align-items-center form-options">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Role Selector -->
        <div class="role-section">
          <label class="role-title">Login As</label>
          <div class="role-grid">
            <div class="role-box active" data-role="student">
              <i class="bi bi-mortarboard"></i>
              <span>Student</span>
            </div>
            <div class="role-box" data-role="supervisor">
              <i class="bi bi-person-badge"></i>
              <span>Supervisor</span>
            </div>
            
            <div class="role-box" data-role="pmo">
              <i class="bi bi-shield-check"></i>
              <span>PMO</span>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-login">
          Login &nbsp;&rarr;
        </button>

        <!-- Divider -->
        <div class="divider-text">
          <span>Or continue with</span>
        </div>

        <!-- University Portal Button -->
        <button type="button" class="btn btn-portal">
          <i class="bi bi-bank"></i> University Portal
        </button>

        <!-- Footer Security -->
        <div class="footer-security">
          <i class="bi bi-shield-lock"></i> Secure &bull; Trusted &bull; GIMS
        </div>
      </form>
    </div>

  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="js/main.js"></script>
</body>
</html>
