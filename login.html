<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIMS - AI-Powered FYP Management Portal</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="main-card">
  <div class="row g-0">
    
    <!-- LEFT PANEL: BACKGROUND IMAGE WITH OVERLAY LOGO -->
    <div class="col-lg-6 left-section-img">
      <div class="custom-logo-overlay">
      </div>
    </div>

    <!-- RIGHT PANEL: LOGIN FORM -->
    <div class="col-lg-6 right-section">

      <!-- Welcome Heading -->
      <div class="login-header">
        <h2 class="welcome-title">Welcome</h2>
        <p class="welcome-sub">Sign in to your access portal</p>
      </div>

      <form id="loginForm">
        <!-- Dynamic Error/Success Alert Box -->
        <div id="loginAlert" class="alert d-none py-2 px-3 mb-3" role="alert" style="font-size: 11.5px;"></div>

        <!-- Hidden Field for Selected Role (Default: student) -->
        <input type="hidden" name="user_role" id="selectedRoleInput" value="student">

       
        <div class="role-section">
          <label class="role-title">Select Role </label>
          <div class="role-grid">
            <div class="role-box active" data-role="student">
              <i class="bi bi-mortarboard"></i>
              <span>Student</span>
            </div>
            <div class="role-box" data-role="supervisor">
              <i class="bi bi-person-badge"></i>
              <span>Supervisor</span>
            </div>
            <div class="role-box" data-role="pmo">
              <i class="bi bi-shield-check"></i>
              <span>PMO </span>
            </div>
          </div>
        </div>

        <!-- Dynamic Identity Field (Registration No. or Email) -->
        <div class="form-group-custom">
          <label class="form-label" id="identityLabel">Registration No.</label>
          <div class="input-wrapper">
            <i class="bi bi-card-heading input-icon" id="identityIcon"></i>
            <input type="text" name="user_identity" id="userIdentity" class="form-control" placeholder="Enter your reg number (e.g., 23-arid-3134)" required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group-custom">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <i class="bi bi-lock input-icon"></i>
            <input type="password" name="password" id="passwordInput" class="form-control" placeholder="••••••••••••" required>
            <i class="bi bi-eye-slash toggle-password" id="togglePassword"></i>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="d-flex justify-content-between align-items-center form-options">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMe" checked>
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Submit Button with Loading State -->
        <button type="submit" id="btnLogin" class="btn btn-login">
          <span id="btnText">Login &nbsp;&rarr;</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
        

      </form>
    </div>
    <!-- FORGOT PASSWORD MODAL POPUP -->
<div class="modal-backdrop" id="forgotPasswordModal">
    <div class="modal-card">
        <div class="modal-header">
            <div>
                <h5 class="modal-title">Reset Password</h5>
                <p class="modal-subtitle">Enter your details to receive password reset instructions.</p>
            </div>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>

        <form id="forgotPasswordForm">
            <div class="form-group mb-3">
                <label class="form-label">Select Your Role</label>
                <select class="form-select" id="resetRole" required>
                    <option value="student" selected>Student</option>
                    <option value="supervisor">Supervisor</option>
                    <option value="pmo">PMO </option>
                </select>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Registered Email / Reg No.</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="text" class="form-control" id="resetInput" placeholder="Enter email or Reg No (e.g., 23-arid-3134)" required>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="cancelModalBtn">Cancel</button>
                <button type="submit" class="btn-submit">Send Reset Link <i class="fa-solid fa-paper-plane ms-1"></i></button>
            </div>
        </form>
    </div>
</div>

  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="js/login.js"></script>
</body>
</html>
