<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIMS - AI-Powered FYP Management Portal</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="main-card">
  <div class="row g-0">
    
    <!-- LEFT PANEL: BACKGROUND IMAGE WITH OVERLAY LOGO -->
    <div class="col-lg-6 left-section-img">
      
    </div>

    <!-- RIGHT PANEL: LOGIN FORM -->
    <div class="col-lg-6 right-section">
      <!-- Top Navigation Text -->
      

      <!-- Welcome Heading -->
      <div class="login-header">
        <h2 class="welcome-title">Welcome </h2>
        <p class="welcome-sub">Sign in to your access portal</p>
      </div>

      <form id="loginForm">
  <!-- Dynamic Error/Success Alert Box -->
  <div id="loginAlert" class="alert d-none py-2 px-3 mb-3" role="alert" style="font-size: 11.5px;"></div>

  <!-- Hidden Field for Selected Role (Default: student) -->
  <input type="hidden" name="user_role" id="selectedRoleInput" value="student">

  <!-- Email / Registration Field -->
  <div class="form-group-custom">
    <label class="form-label">Email / Registration No.</label>
    <div class="input-wrapper">
      <i class="bi bi-envelope input-icon"></i>
      <input type="text" name="user_identity" id="userIdentity" class="form-control" placeholder="Enter your email or registration number" required>
    </div>
  </div>

  <!-- Password Field -->
  <div class="form-group-custom">
    <label class="form-label">Password</label>
    <div class="input-wrapper">
      <i class="bi bi-lock input-icon"></i>
      <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Enter your password" required>
      <i class="bi bi-eye-slash toggle-password" id="togglePassword"></i>
    </div>
  </div>

  <!-- Remember Me & Forgot Password -->
  <div class="d-flex justify-content-between align-items-center form-options">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMe" checked>
      <label class="form-check-label" for="rememberMe">Remember me</label>
    </div>
    <a href="#" class="forgot-link">Forgot Password?</a>
  </div>

  <!-- Role Selector Grid -->
  <div class="role-section">
    <label class="role-title">Login As</label>
    <div class="role-grid">
      <div class="role-box active" data-role="student">
        <i class="bi bi-mortarboard"></i>
        <span>Student</span>
      </div>
      <div class="role-box" data-role="supervisor">
        <i class="bi bi-person-badge"></i>
        <span>Supervisor</span>
      </div>
      <div class="role-box" data-role="pmo">
        <i class="bi bi-shield-check"></i>
        <span>PMO</span>
      </div>
    </div>
  </div>

  <!-- Submit Button with Loading State -->
  <button type="submit" id="btnLogin" class="btn btn-login">
    <span id="btnText">Login &nbsp;&rarr;</span>
    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
  </button>

  

  
</form>
    </div>

  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="js/login.js"></script>
</body>
</html>
